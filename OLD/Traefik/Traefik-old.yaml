- name: Configurar Traefik Dashboard en K3s
  hosts: node01
  gather_facts: false
  tasks:
    - name: Crear configuracion de HelmChartConfig para Traefik
      ansible.builtin.copy:
        dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
        content: |
          apiVersion: helm.cattle.io/v1
          kind: HelmChartConfig
          metadata:
            name: traefik
            namespace: kube-system
          spec:
            valuesContent: |-
              additionalArguments:
                - "--api.dashboard=true"
                - "--api.insecure=true"
            providers:
              kubernetesCRD:
                enabled: true
            service:
              spec:
                externalTrafficPolicy: Local
        owner: root
        group: root
        mode: '0644'
      notify: Reiniciar K3s para aplicar HelmChartConfig

  handlers:
    - name: Reiniciar K3s para aplicar HelmChartConfig
      ansible.builtin.systemd:
        name: k3s
        state: restarted

- name: Aplicar IngressRoute para el Dashboard en el cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "/home/toletum/dev/create_k8s/venv/bin/python3"
  tasks:
    - name: Aplicar IngressRoute apuntando al dashboard
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: traefik-dashboard
            namespace: kube-system
          spec:
            entryPoints:
              - web
            routes:
              - match: Host(`node01`)
                kind: Rule
                services:
                  - name: api@internal
                    kind: TraefikService

    - name: Verificar acceso HTTP al Dashboard de Traefik
      ansible.builtin.uri:
        url: "http://node01/dashboard/"
        method: GET
        status_code: 200
      register: dashboard_check
      retries: 5
      delay: 3
      until: dashboard_check is succeeded
