apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-echo
  labels:
    app: web-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-echo
  template:
    metadata:
      labels:
        app: web-echo
    spec:
      containers:
      - name: whoami
        image: traefik/whoami
        ports:
        - containerPort: 80
        env:
        - name: MI_VARIABLE_EJEMPLO
          value: "Hola desde k3s"
---
apiVersion: v1
kind: Service
metadata:
  name: web-echo-svc
spec:
  type: ClusterIP
  ports:
  - port: 81
    targetPort: 80
  selector:
    app: web-echo
---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web81:
        port: 81
        exposedPort: 81
        expose:
          default: true
        protocol: TCP
        forwardedHeaders:
          insecure: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: add-custom-header
  namespace: default
spec:
  headers:
    customResponseHeaders:
      X-Test-Header: "Hello World!!"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web-echo-ingress
  namespace: default
spec:
  entryPoints:
    - web81  # O el entrypoint que estés utilizando (ej. web)
  routes:
    - match: Host(`node01`)
      kind: Rule
      middlewares:
        - name: add-custom-header # <-- Aquí asociamos el middleware
      services:
        - name: web-echo-svc
          port: 81
