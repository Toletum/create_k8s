version: '3.8'

services:
  database:
    image: docker.io/library/postgres:15-alpine
    container_name: directus_postgres
    restart: always
    environment:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: 111111
      POSTGRES_DB: directus
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - directus-net

  directus:
    image: docker.io/directus/directus:latest
    container_name: directus_app
    restart: always
    ports:
      - "8055:8055"
    environment:
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: 111111
      DB_CLIENT_2: pg
      DB_HOST_2: database
      DB_PORT_2: 5432
      DB_DATABASE_2: toletum
      DB_USER_2: directus
      DB_PASSWORD_2: 111111
      KEY: "KEYKEYKEYKEYKEYKEYKEYKEYKEYKEYKEY"
      SECRET: "SECRETSECRETSECRETSECRETSECRETSECRET"
    depends_on:
      - database
    networks:
      - directus-net

volumes:
  pgdata:

networks:
  directus-net:
    driver: bridge
